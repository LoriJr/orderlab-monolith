server:
  port: 9090
spring:
  application:
    name: orderlab

  notification:
    simulator:
      base-url: http://localhost:9091

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate