services:
  orderlab-mono-db:
    image: postgres:18
    container_name: orderlab-mono-db

    cpus: "1.0"
    mem_limit: 1g
    memswap_limit: 1g

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"
    volumes:
      - orderlab-mono-db_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  notification-simulator:
    image: notification-simulator-app

    cpus: "1.0"
    mem_limit: 512m
    memswap_limit: 512m

    build:
      context: ../notification-simulator
      dockerfile: Dockerfile
      network: host
      entitlements:
        - network.host

    environment:
      SIMULATOR_DELAY_MS: ${SIMULATOR_DELAY_MS:-1000}
      SIMULATOR_FAIL_ENABLED: ${SIMULATOR_FAIL_ENABLED:-false}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"

    ports:
      - "127.0.0.1:9091:9091"

  orderlab:
    image: orderlab-app

    cpus: "1.0"
    mem_limit: 1g
    memswap_limit: 1g

    build:
      context: .
      dockerfile: Dockerfile
      network: host
      entitlements:
        - network.host

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://orderlab-mono-db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      NOTIFICATION_SIMULATOR_BASE_URL: http://notification-simulator:9091
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"

    ports:
      - "127.0.0.1:9090:9090"

    depends_on:
      orderlab-mono-db:
        condition: service_healthy
      notification-simulator:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest

    cpus: "0.5"
    mem_limit: 512m
    memswap_limit: 512m

    ports:
      - "127.0.0.1:9092:9090"

    volumes:
      - type: bind
        source: ./monitoring/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: false

      - prometheus_data:/prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d

  grafana:
    image: grafana/grafana:latest

    cpus: "1.0"
    mem_limit: 512m
    memswap_limit: 512m

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD}

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - type: bind
        source: ./monitoring/grafana/datasources.yml
        target: /etc/grafana/provisioning/datasources/prometheus.yml
        read_only: true
        bind:
          create_host_path: false


    depends_on:
      prometheus:
        condition: service_started

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.21.1

    cpus: "0.25"
    mem_limit: 128m
    memswap_limit: 128m

    environment:
      DATA_SOURCE_USER: postgres_exporter
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD}

    command:
      - "--datasource.uri=orderlab-mono-db:5432/${POSTGRES_DB}?sslmode=disable"

    ports:
      - "127.0.0.1:9187:9187"

    depends_on:
      orderlab-mono-db:
        condition: service_healthy

volumes:
  orderlab-mono-db_data:
  prometheus_data:
  grafana_data: