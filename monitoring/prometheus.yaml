global:
  scrape_interval: 5s
  scrape_timeout: 3s

scrape_configs:
  - job_name: orderlab
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - orderlab:9090

  - job_name: notification-simulator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - notification-simulator:9091